# nginx-rtmp configuration for stream bridging and timestamp sync

worker_processes auto;
error_log /var/log/nginx/error.log info;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# RTMP server configuration
rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # Ingest endpoint (phone/ffmpeg): rtmp://host:1935/publish/<stream-key>
        application publish {
            live on;
            record off;
            wait_key on;
            wait_video on;
            drop_idle_publisher 10s;

            # Validate stream key AND capture start timestamp via Node.js
            on_publish http://localhost:5000/rtmp/on_publish;

            # Ingest-only app
            deny play all;

            # Relay to local listen app for playback clients (OBS/ffplay)
            push rtmp://127.0.0.1:1935/listen;

            # Capture timestamp when stream ends
            on_publish_done http://localhost:5000/rtmp/on_publish_done;
        }

        # Playback endpoint (OBS/ffplay): rtmp://host:1935/listen/<stream-key>
        application listen {
            live on;
            record off;
            wait_key on;
            wait_video on;
            drop_idle_publisher 10s;

            # Playback-only app
            allow play all;
            # Allow only local nginx relay publisher from /publish.
            allow publish 127.0.0.1;
            deny publish all;

            # Optional forward from listen app to external OBS RTMP server.
            include /app/rtmp-push.conf;
        }
    }
}

# HTTP server for stats and API
http {
    include /usr/local/nginx/conf/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;

    server {
        listen 8080;
        server_name localhost;

        # nginx-rtmp stats in XML format
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            alias /app/html/stat.xsl;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
        }
    }
}
