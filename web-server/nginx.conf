# nginx-rtmp configuration for stream bridging and timestamp sync

worker_processes auto;
error_log /var/log/nginx/error.log info;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# RTMP server configuration
rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Validate stream key AND capture start timestamp via Node.js
            on_publish http://localhost:5000/rtmp/on_publish;

            # Allow playing from any source (local playback)
            allow play all;

            # Forward stream to OBS (loaded from external config)
            include /app/rtmp-push.conf;

            # Capture timestamp when stream ends
            on_publish_done http://localhost:8080/internal/on_publish_done;
        }
    }
}

# HTTP server for stats and API
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;

    server {
        listen 8080;
        server_name localhost;

        # Lua shared memory for storing stream timestamps
        lua_shared_dict stream_info 1m;

        # Internal endpoint called by Node.js after validating stream key.
        # Stores the timestamp (provided by Node) in shared dict for /stream/info queries.
        # Node handles the broadcast/session logic directly — no callback needed here.
        location /internal/on_publish {
            allow 127.0.0.1;
            deny all;
            access_log off;

            content_by_lua_block {
                local stream_info = ngx.shared.stream_info
                -- Use timestamp provided by Node so both sides agree on the value
                local ts_arg = ngx.var.arg_ts
                local now_ms = ts_arg and tonumber(ts_arg) or (ngx.now() * 1000)
                local stream_name = ngx.var.arg_name or "unknown"

                stream_info:set("is_live", "true")
                stream_info:set("stream_start_time", now_ms)
                stream_info:set("stream_name", stream_name)
                stream_info:set("last_update", now_ms)

                ngx.log(ngx.INFO, "RTMP stream info stored at ", now_ms, " ms")

                ngx.status = ngx.HTTP_OK
                ngx.say("OK")
            }
        }

        # Internal endpoint called by RTMP on_publish_done
        location /internal/on_publish_done {
            allow 127.0.0.1;
            deny all;
            access_log off;

            content_by_lua_block {
                local stream_info = ngx.shared.stream_info
                local cjson = require "cjson"
                local now_ms = ngx.now() * 1000

                -- Mark stream as stopped
                stream_info:set("is_live", "false")

                ngx.log(ngx.INFO, "RTMP stream stopped")

                -- Notify Node.js server about stream stop
                local http = require "resty.http"
                local httpc = http.new()
                httpc:set_timeout(1000)

                local body = cjson.encode({
                    event = "stop",
                    timestamp_ms = now_ms
                })

                local res, err = httpc:request_uri("http://localhost:5000/rtmp/stream-event", {
                    method = "POST",
                    body = body,
                    headers = {
                        ["Content-Type"] = "application/json"
                    }
                })

                if not res then
                    ngx.log(ngx.WARN, "Failed to notify server: ", err)
                end

                ngx.status = ngx.HTTP_OK
                ngx.say("OK")
            }
        }

        # Public API endpoint for stream info (queried by Node.js)
        location /stream/info {
            default_type application/json;

            content_by_lua_block {
                local stream_info = ngx.shared.stream_info
                local cjson = require "cjson"

                local is_live = stream_info:get("is_live") or "false"
                local stream_start = stream_info:get("stream_start_time") or 0
                local stream_name = stream_info:get("stream_name") or "unknown"

                local response = {
                    is_live = (is_live == "true"),
                    stream_start_time_unix_ms = tonumber(stream_start),
                    stream_name = stream_name,
                    server_time_unix_ms = ngx.now() * 1000
                }

                ngx.say(cjson.encode(response))
            }
        }

        # nginx-rtmp stats in XML format
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            alias /app/html/stat.xsl;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
        }
    }
}
